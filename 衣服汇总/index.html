<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPMA 服装图鉴</title>
<style>
:root{color-scheme:light;--ink:#263238;--muted:#687780;--line:#dce3e7;--paper:#f4f7f8;--card:#fff;--accent:#176b66}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
header{background:linear-gradient(120deg,#164f50,#20877b);color:white;padding:26px max(20px,calc((100% - 1240px)/2)) 22px}h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:#d8efeb}
main{max-width:1240px;margin:20px auto;padding:0 18px}.toolbar,.filters,.cloth{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #20313b0a}.toolbar{padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input[type=search]{flex:1;min-width:220px}input[type=search],select,button{font:inherit;border:1px solid #c8d3d8;border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.options{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.filters{margin:12px 0;padding:12px 14px}.filter-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}.filter-list{display:flex;gap:6px 14px;flex-wrap:wrap}.filter-list label{white-space:nowrap}.status{padding:14px;color:var(--muted)}.status.error{color:#9c2f2f;background:#fff0f0;border:1px solid #f1caca;border-radius:10px}.status code{word-break:break-all}.section-title{margin:24px 2px 8px;font-size:20px}.cloth{padding:16px;margin:10px 0}.cloth h3{margin:0 0 12px;font-size:18px}.date{font-size:13px;color:var(--muted);font-weight:400}.images{display:flex;gap:12px;flex-wrap:wrap}.image-card{margin:0;width:min(240px,100%);text-align:center;color:var(--muted);font-size:13px}.image-card img{display:block;width:100%;height:260px;object-fit:contain;background:#f7f9fa;border:1px solid #edf0f2;border-radius:8px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:600px){header{padding:20px}h1{font-size:23px}.image-card{width:calc(50% - 6px)}.image-card img{height:210px}}
</style>
</head>
<body>
<header><h1>👕 HPMA 服装图鉴</h1><p id="summary">正在加载服装数据…</p></header>
<main>
<div class="toolbar">
<input id="search" type="search" placeholder="搜索服装名称或类型…" aria-label="搜索服装名称或类型">
<div class="options"><label>日期 <select id="dateOrder"><option value="desc">最新优先</option><option value="asc">最早优先</option></select></label><label>排序 <select id="sortPriority"><option value="date">按日期</option><option value="group">按类型分组</option></select></label></div>
</div>
<div class="filters"><div class="filter-head"><strong>类型筛选</strong><button id="toggleAll" type="button">全不选</button></div><div id="groupFilters" class="filter-list"></div></div>
<div id="status" class="status">正在读取 hpma_database.json…</div><div id="clothes"></div>
</main>
<script>
'use strict';
let allClothes=[];
const $=id=>document.getElementById(id);
const safeType=item=>item.type||'未分类';
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showError(message){$('status').className='status error';$('status').innerHTML=message;$('summary').textContent='数据加载失败';}
async function loadClothes(){
 try{const response=await fetch('./hpma_database.json');if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(!Array.isArray(data))throw new Error('JSON 格式不是服装列表');allClothes=data;renderGroupFilters();renderClothes();}
 catch(error){console.error(error);showError(`无法加载服装数据：${escapeHtml(error.message)}。<br><br>请双击本目录中的 <strong>打开图鉴.bat</strong>，等待启动脚本自动打开页面（地址会显示在命令窗口）。不要直接双击 index.html。确认 hpma_database.json 与 index.html 在同一目录。`);}
}
function renderGroupFilters(){const types=[...new Set(allClothes.map(safeType))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('groupFilters').innerHTML=types.map((type,i)=>`<label><input type="checkbox" class="group-filter" value="${escapeHtml(type)}" checked> ${escapeHtml(type)}</label>`).join('');}
function dateCompare(a,b){const ad=a.date||'',bd=b.date||'';if(!ad)return bd?1:0;if(!bd)return -1;return $('dateOrder').value==='asc'?ad.localeCompare(bd):bd.localeCompare(ad);}
function renderClothes(){
 const selected=new Set([...document.querySelectorAll('.group-filter:checked')].map(x=>x.value));const query=$('search').value.trim().toLocaleLowerCase();const filtered=allClothes.filter(c=>selected.has(safeType(c))&&(!query||`${c.name||''} ${safeType(c)}`.toLocaleLowerCase().includes(query)));
 $('status').className='status';$('status').textContent=`共 ${allClothes.length} 套，当前显示 ${filtered.length} 套`;$('summary').textContent=`共收录 ${allClothes.length} 套服装 · ${new Set(allClothes.map(safeType)).size} 种类型`;
 const priority=$('sortPriority').value;let html='';
 const card=c=>`<article class="cloth"><h3>${escapeHtml(c.name||'未命名')} <span class="date">上线日期：${escapeHtml(c.date||'未知')}</span></h3><div class="images">${(Array.isArray(c.images)?c.images:[]).map(img=>`<figure class="image-card"><a href="${escapeHtml(img.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${escapeHtml(img.url)}" alt="${escapeHtml(img.name||c.name)}"></a><figcaption>${escapeHtml(img.name||'')}</figcaption></figure>`).join('')}</div></article>`;
 if(priority==='group'){const groups={};filtered.forEach(c=>(groups[safeType(c)]??=[]).push(c));for(const type of Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-CN'))){html+=`<h2 class="section-title">${escapeHtml(type)} <span class="date">(${groups[type].length})</span></h2>${groups[type].sort(dateCompare).map(card).join('')}`;}}
 else{filtered.sort(dateCompare);html=filtered.map(c=>`<h2 class="section-title">${escapeHtml(safeType(c))}</h2>${card(c)}`).join('');}
 $('clothes').innerHTML=html||'<div class="empty">没有找到符合条件的服装。试试调整搜索词或类型筛选。</div>';
}
$('search').addEventListener('input',renderClothes);$('dateOrder').addEventListener('change',renderClothes);$('sortPriority').addEventListener('change',renderClothes);$('groupFilters').addEventListener('change',renderClothes);
$('toggleAll').addEventListener('click',()=>{const boxes=[...document.querySelectorAll('.group-filter')],all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);$('toggleAll').textContent=all?'全选':'全不选';renderClothes();});
loadClothes();
</script>
</body></html>
